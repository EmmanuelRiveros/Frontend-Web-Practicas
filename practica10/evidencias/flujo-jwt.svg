n el passwordHash</text><text x="534" y="153" font-family="Arial" font-size="19" font-weight="normal">Credenciales incorrectas -&gt; 401</text><rect x="520" y="250" width="330" height="110" rx="9" fill="#eef5fa" stroke="#8b9ca7" stroke-width="2"/><text x="534" y="279" font-family="Arial" font-size="21" font-weight="bold">Servidor firma con JWT_SECRET</text><text x="534" y="306" font-family="Arial" font-size="19" font-weight="normal">HS256 y caducidad de una hora</text><rect x="50" y="230" width="330" height="150" rx="9" fill="#eef5fa" stroke="#8b9ca7" stroke-width="2"/><text x="64" y="259" font-family="Arial" font-size="21" font-weight="bold">JWT recibido por el cliente</text><text x="64" y="286" font-family="Arial" font-size="19" font-weight="normal">header.payload.firma</text><text x="64" y="313" font-family="Arial" font-size="19" font-weight="normal">Header con alg y typ</text><text x="64" y="340" font-family="Arial" font-size="19" font-weight="normal">Payload con sub rol y miembroId</text><rect x="50" y="460" width="330" height="100" rx="9" fill="#eef5fa" stroke="#8b9ca7" stroke-width="2"/><text x="64" y="489" font-family="Arial" font-size="21" font-weight="bold">Cliente pide una ruta privada</text><text x="64" y="516" font-family="Arial" font-size="19" font-weight="normal">Authorization Bearer JWT</text><rect x="520" y="460" width="330" height="110" rx="9" fill="#eef5fa" stroke="#8b9ca7" stroke-width="2"/><text x="534" y="489" font-family="Arial" font-size="21" font-weight="bold">JwtAuthGuard y JwtStrategy</text><text x="534" y="516" font-family="Arial" font-size="19" font-weight="normal">Verifican firma y exp</text><rect x="520" y="660" width="330" height="110" rx="9" fill="#eef5fa" stroke="#8b9ca7" stroke-width="2"/><text x="534" y="689" font-family="Arial" font-size="21" font-weight="bold">Firma válida -&gt; req.user</text><text x="534" y="716" font-family="Arial" font-size="19" font-weight="normal">UsuarioActual lee los claims</text><text x="534" y="743" font-family="Arial" font-size="19" font-weight="normal">El controlador compara identidad</text><rect x="50" y="660" width="330" height="110" rx="9" fill="#fff0ef" stroke="#8b9ca7" stroke-width="2"/><text x="64" y="689" font-family="Arial" font-size="21" font-weight="bold">No hay token o fue alterado</text><text x="64" y="716" font-family="Arial" font-size="19" font-weight="normal">Autenticación no válida</text><text x="64" y="743" font-family="Arial" font-size="19" font-weight="normal">401 Unauthorized</text><rect x="520" y="880" width="330" height="110" rx="9" fill="#eef5fa" stroke="#8b9ca7" stroke-width="2"/><text x="534" y="909" font-family="Arial" font-size="21" font-weight="bold">Identidad y rol permitidos</text><text x="534" y="936" font-family="Arial" font-size="19" font-weight="normal">Ejecuta la operación</text><text x="534" y="963" font-family="Arial" font-size="19" font-weight="normal">201 al crear o 200 al cancelar</text><rect x="50" y="880" width="330" height="110" rx="9" fill="#fff0ef" stroke="#8b9ca7" stroke-width="2"/><text x="64" y="909" font-family="Arial" font-size="21" font-weight="bold">Token válido pero sin permiso</text><text x="64" y="936" font-family="Arial" font-size="19" font-weight="normal">Otro miembro o rol prohibido</text><text x="64" y="963" font-family="Arial" font-size="19" font-weight="normal">403 Forbidden</text></svg>